<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Nutrition Support Calculator">
  <title>Nutrition Support Calculator</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand" aria-label="Application introduction">
      <div class="brand-mark" aria-hidden="true">NSC</div>
      <div>
        <p class="eyebrow" data-i18n="app.kicker">Clinical Nutrition</p>
        <h1 data-i18n="app.name">Nutrition Support Calculator</h1>
        <p class="brand-copy" data-i18n="app.tagline">A clinical workspace for nutrition assessment, planning and follow-up.</p>
      </div>
    </section>

    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card-header">
        <div>
          <p class="eyebrow" data-i18n="auth.welcome">Welcome</p>
          <h2 id="auth-title" data-i18n="auth.loginTitle">Sign in</h2>
        </div>
        <button id="languageToggle" class="icon-button" type="button" aria-label="Switch language">ع</button>
      </div>

      <div id="authMessage" class="alert hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="loginEmail" data-i18n="auth.email">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="loginPassword" data-i18n="auth.password">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary button-block" type="submit" data-i18n="auth.login">Sign in</button>
      </form>

      <div class="auth-links">
        <button id="showSignup" class="link-button" type="button" data-i18n="auth.createAccount">Create account</button>
        <button id="showReset" class="link-button" type="button" data-i18n="auth.forgotPassword">Forgot password?</button>
      </div>

      <form id="signupForm" class="hidden" novalidate>
        <div class="form-heading"><h3 data-i18n="auth.createTitle">Create account</h3></div>
        <div class="field-group"><label for="signupEmail" data-i18n="auth.email">Email</label><input id="signupEmail" type="email" autocomplete="email" required></div>
        <div class="field-group"><label for="signupPassword" data-i18n="auth.password">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required></div>
        <button class="button button-primary button-block" type="submit" data-i18n="auth.create">Create account</button>
        <button id="backToLoginFromSignup" class="button button-secondary button-block" type="button" data-i18n="auth.back">Back to sign in</button>
      </form>

      <form id="resetForm" class="hidden" novalidate>
        <div class="form-heading"><h3 data-i18n="auth.resetTitle">Reset password</h3></div>
        <div class="field-group"><label for="resetEmail" data-i18n="auth.email">Email</label><input id="resetEmail" type="email" autocomplete="email" required></div>
        <button class="button button-primary button-block" type="submit" data-i18n="auth.sendReset">Send reset link</button>
        <button id="backToLoginFromReset" class="button button-secondary button-block" type="button" data-i18n="auth.back">Back to sign in</button>
      </form>

      <p class="security-note" data-i18n="auth.security">Your account and data are protected by Supabase Authentication and database security policies.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
